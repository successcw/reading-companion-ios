name: ReadingCompanion
packages:
  SwiftEdgeTTS:
    path: Vendor/SwiftEdgeTTS
options:
  bundleIdPrefix: com.cg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  ReadingCompanion:
    type: application
    platform: iOS
    sources:
      - path: ReadingCompanion
    dependencies:
      - package: SwiftEdgeTTS
    info:
      path: ReadingCompanion/Info.plist
      properties:
        CFBundleDisplayName: "橘猫陪读"
        CFBundleDevelopmentRegion: zh_CN
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSMicrophoneUsageDescription: "用于语音向橘猫陪读提问。"
        NSSpeechRecognitionUsageDescription: "用于把你说的话转成文字。"
        NSLocalNetworkUsageDescription: "用于接收同一热点下 Kindle 上报的阅读进度。"
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cg.readingcompanion
        PRODUCT_NAME: ReadingCompanion
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
